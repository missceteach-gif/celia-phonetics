ink)}.card:hover{border-color:#169cb1;transform:translateY(-2px)}.card .big{font-size:clamp(2.1rem,4vw,3rem);font-weight:850;line-height:1}.card h3{font-size:clamp(1.5rem,3.3vw,2rem)}.card .subtitle{color:var(--muted);font-size:1.04rem}.card .foot{margin-top:auto;color:#0c6c86;font-weight:850}.lessonInfo{border-left:5px solid #d27c76;background:#fff;padding:18px 20px;border-radius:0 16px 16px 0;margin:18px 0 22px}.lessonInfo p{color:var(--muted);font-size:1.05rem}.lessonInfo h2{margin-bottom:8px}.audioInfo{margin:12px 0;padding:16px;border-radius:17px;background:#fff5e9;border:1px solid #ead8c5;display:flex;align-items:center;justify-content:space-between;gap:15px;flex-wrap:wrap}.audioInfo a{font-weight:800;color:#9b4b18;text-decoration:underline}.audioInfo small{display:block;color:#704d32;max-width:650px}.progress{height:14px;width:100%;appearance:none;border:0;border-radius:20px;background:#deeaeb;overflow:hidden;margin:6px 0 18px}.progress::-webkit-progress-bar{background:#deeaeb}.progress::-webkit-progress-value{background:#1a9d83}.progress::-moz-progress-bar{background:#1a9d83}.game{max-width:900px;margin:auto}.gameHead{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:18px;flex-wrap:wrap}.sectionLabel{font-weight:850;color:#28748b;letter-spacing:.02em}.task{background:#fff;border:2px solid var(--line);border-radius:25px;padding:clamp(22px,4vw,36px);display:grid;gap:20px}.task .question{font-weight:850;font-size:clamp(1.5rem,4vw,2.25rem);line-height:1.34;color:#17364c}.question .mask{color:#ba615e;border-bottom:3px dashed #efaaaa}.translation{font-size:clamp(1.07rem,2.2vw,1.25rem);color:#526b7a;background:#f0f6f8;padding:11px 14px;border-radius:13px}.photoBox{width:min(100%,390px);aspect-ratio:1.26;margin:auto;border-radius:18px;background-color:#fff;background-repeat:no-repeat;border:2px solid #d3e0e4;box-shadow:0 6px 18px #16384d10}.choices{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.choice{backgrou function feedback(){return `<div class="feedback ${Z.done?'good':Z.wrong?'bad':''}" id="feedback" role="status" aria-live="polite">${Z.message||'Pulsa tu respuesta. Si te equivocas, puedes intentarlo de nuevo.'}</div>`}
function choicesBlock(q,correct,question,translation,photo){const options=Z.mode==='error'?q.options:Z.mode==='reverse'?q.options:Z.mode==='picture'?q.options:Z.mode==='review'&&q.en?q.options:shuffle(q.options||[],q.id+Z.lesson);
return `<section class="task">${photo||''}<p class="question">${question}</p>${translation?`<p class="translation">${translation}</p>`:''}<div class="choices">${options.map((v,i)=>`<button class="choice ${Z.done&&norm(v)===norm(correct)?'correct':''} ${Z.selected===v&&!Z.done?'chosen':''}" onclick="app.choose(${JSON.stringify(v).replaceAll('"','&quot;')})" ${Z.done?'disabled':''}>${esc(v)}</button>`).join('')}</div>${feedback()}${Z.done?`<p class="translation">✓ <b>${esc(correct)}</b> · ${esc(q.help||q.why||q.es||'')}</p><div class="actions"><button class="button" onclick="app.next()">${Z.index===games().length-1?'Ver resultados':'Siguiente reto →'}</button></div>`:Z.errors>=2?`<button class="button ghost" onclick="app.reveal()">Ver respuesta y aprender</button>`:''}</section>`}
function question(){const qs=games(),q=qs[Z.index];if(!q)return renderResult();let body='';
if(Z.mode==='picture')body=choicesBlock(q,q.en,'What is this? · ¿Qué ves?', 'Observa la fotografía original del Vocabulary Bank y elige la palabra inglesa.',picHTML(q));
if(Z.mode==='reverse')body=choicesBlock(q,q.en,'¿Cómo se dice en inglés?',esc(q.es),q.pic?picHTML(q):'');
if(Z.mode==='grammar'||Z.mode==='gap')body=choicesBlock(q,q.answer,esc(q.prompt),'💡 '+esc(q.es||'Elige la opción correcta para completar.'),'');
if(Z.mode==='review')body=q.en?choicesBlock(q,q.en,'¿Cómo se dice en inglés?',esc(q.es),q.pic?picHTML(q):''):choicesBlock(q,q.answer,esc(q.prompt),'Repaso de gramática y vocabulario','');
if(Z.mode==='error')body=choicesBlock(q,q.good,'Which sentence is correct?','Elige la frase escrita correctamente.','');
if(Z.mode==='spell'){const show=q.pic?picHTML(q):'';body=`<section class="task">${show}<p class="question">Write the English word · Escribe la palabra en inglés</p><p class="translation">${esc(q.es)}</p><label class="sr" for="typed">Tu respuesta</label><input class="input" id="typed" value="${esc(Z.typed)}" oninput="app.type(this.value)" ${Z.done?'disabled':''} autocorrect="off" spellcheck="false" autocomplete="off" placeholder="Escribe aquí" onkeydown="if(event.key==='Enter'){event.preventDefault();app.checkText()}"/>${feedback()}<div class="actions">${Z.done?`<p><b>✓ ${esc(q.en)}</b></p><button class="button" onclick="app.next()">Siguiente →</button>`:`<button class="button" onclick="app.checkText()">COMPROBAR</button>${Z.errors>=2?'<button class="button ghost" onclick="app.reveal()">Ver respuesta</button>':''}`}</div></section>`}
if(Z.mode==='build'){const words=q.en.split(' ').map((w,i)=>({w,i}));const bank=shuffle(words,'build'+Z.lesson+Z.index);const answer=Z.tokens.map(i=>words[i].w).join(' ');
 body=`<section class="task"><p class="question">Put the words in order · Ordena la frase</p><p class="translation">${esc(q.es)}</p><div class="sent" aria-label="Tu frase">${Z.tokens.length?Z.tokens.map((i,j)=>`<button class="token" onclick="app.undo(${j})">${esc(words[i].w)} ×</button>`).join(''):'Pulsa las palabras de abajo en el orden correcto.'}</div><div class="tokenRow">${bank.map(({i,w})=>`<button class="token" ${Z.tokens.includes(i)||Z.done?'disabled':''} onclick="app.token(${i})">${esc(w)}</button>`).join('')}</div>${feedback()}<div class="actions">${Z.done?`<p><b>✓ ${esc(q.en)}</b> · ${esc(q.why)}</p><button class="button" onclick="app.next()">Siguiente →</button>`:`<button class="button" onclick="app.checkBuild()">COMPROBAR FRASE</button><button class="button secondary" onclick="app.clearTokens()">Borrar y empezar</button>${Z.errors>=2?'<button class="button ghost" onclick="app.reveal()">Ver respuesta</button>':''}`}</div></section>`}
if(Z.mode==='match')body=matchBody(q);
return `<div class="game">${taskHeader(q,qs.length)}${body}</div>`}
function matchBody(q){const left=q.pairs.map((v,i)=>({...v,i}));const right=shuffle(left,'right'+Z.lesson+Z.index);return `<section class="task"><h2>Match the pairs · Une inglés y español</h2><p class="translation">Pulsa primero una palabra en inglés (izquierda) y después su significado (derecha). Las parejas correctas se quedan marcadas.</p><div class="matchGrid"><div class="matchCol">${left.map(v=>`<button class="matchCard ${Z.left===v.i?'selected':''} ${Z.matched.includes(v.i)?'matched':''}" ${Z.matched.includes(v.i)?'disabled':''} onclick="app.left(${v.i})">${esc(v.en)}</button>`).join('')}</div><div class="matchCol">${right.map(v=>`<button class="matchCard ${Z.matched.includes(v.i)?'matched':''}" ${Z.matched.includes(v.i)?'disabled':''} onclick="app.right(${v.i})">${esc(v.es)}</button>`).join('')}</div></div><p class="counter">${Z.matched.length}/${left.length} parejas correctas</p>${feedback()}${Z.matched.length===left.length?`<button class="button" onclick="app.next()">${Z.index===games().length-1?'Ver resultados':'Siguiente grupo →'}</button>`:''}</section>`}
function renderResult(){markDone(Z.lesson,Z.mode);const modes=Object.keys(names).filter(m=>m!=='picture'||getL().bank),idx=modes.indexOf(Z.mode),next=modes[idx+1];return `<div class="game">${hero()}<div class="result"><h2>🎉 Activity complete!</h2><strong>${Z.answers}/${games().length}</strong><p>Retos resueltos al primer intento. Puedes repetir el juego para mejorar y practicar los errores.</p><p>¡Muy bien por seguir practicando! 🌟</p><div class="actions"><button class="button" onclick="app.game('${Z.mode}')">Repetir juego</button>${next?`<button class="button" onclick="app.game('${next}')">Siguiente juego →</button>`:''}<button class="button secondary" onclick="app.lesson('${Z.lesson}')">Volver al menú</button></div></div></div>`}
function display(){const qs=Z.mode?games():null;root.innerHTML=Z.mode?(Z.index>=qs.length?renderResult():question()):Z.lesson?lessons():home();window.scrollTo({top:0,behavior:'instant'})}
function setRoute(){location.hash=Z.lesson?(Z.mode?Z.lesson+'/'+Z.mode:Z.lesson):''}
const app={unit(n){Z.unit=n;Z.lesson='';Z.mode='';setRoute();display()},lesson(id){Z.lesson=id;Z.unit=id[0];Z.mode='';setRoute();display()},game(m){Z.mode=m;setRoute();startGame()},next(){Z.index++;Object.assign(Z,{done:false,selected:'',typed:'',tokens:[],left:null,matched:[],wrong:'',errors:0,message:''});display()},choose(v){if(Z.done)return;const q=games()[Z.index],correct=Z.mode==='error'?q.good:q.en&&['picture','reverse','review'].includes(Z.mode)?q.en:q.answer;if(norm(v)===norm(correct)){Z.answers+=Z.errors===0?1:0;Z.done=true;Z.wrong='';Z.selected=v;Z.message='✓ Correct! ¡Muy bien!';}else{Z.errors++;Z.selected=v;Z.wrong=v;Z.message='Todavía no. '+(q.help||q.why||'Mira de nuevo la imagen y la traducción.')}display()},reveal(){const q=games()[Z.index];Z.done=true;Z.message='Aquí tienes la respuesta para repasar. '+esc(q.help||q.why||'');display()},token(i){if(Z.done||Z.tokens.includes(i))return;Z.tokens.push(i);display()},undo(k){if(Z.done)return;Z.tokens.splice(k,1);Z.message='Puedes cambiar el orden. Comprueba cuando hayas terminado.';display()},clearTokens(){Z.tokens=[];Z.errors=0;Z.message='Vamos de nuevo.';display()},checkBuild(){const q=games()[Z.index],v=Z.tokens.map(i=>q.en.split(' ')[i]).join(' ');if(!v)return;Z.errors+=norm(v)!==norm(q.en)?1:0;if(norm(v)===norm(q.en)){Z.done=true;Z.answers+=Z.errors===0?1:0;Z.message='✓ Correct! Has ordenado bien toda la frase.'}else Z.message='El orden no es correcto. Pista: '+q.why;display()},type(v){Z.typed=v},checkText(){const q=games()[Z.index];if(!Z.typed.trim())return;if(norm(Z.typed)===norm(q.en)){Z.done=true;Z.answers+=Z.errors===0?1:0;Z.message='✓ Correct!';Z.errors=Z.errors;display()}else{Z.errors++;Z.message='Inténtalo otra vez. La traducción en español te da una pista.';Z.wrong=Z.typed;display()}},left(i){if(Z.matched.includes(i))return;Z.left=i;Z.message='Ahora elige su traducción en la columna derecha.';display()},right(i){if(Z.left===null||Z.matched.includes(i))return;if(i===Z.left){Z.matched.push(i);Z.message='✓ ¡Pareja correcta!';Z.left=null;if(Z.matched.length===games()[Z.index].pairs.length)Z.answers++}else{Z.errors++;Z.message='Esa traducción corresponde a otra palabra. Sigue intentándolo.';Z.left=null}display()}};
window.app=app;
function parseHash(){const parts=location.hash.slice(1).split('/');let id=parts[0];if(id&&DB.lessons[id]){Z.lesson=id;Z.unit=id[0];Z.mode=parts[1]&&names[parts[1]]?parts[1]:'';if(Z.mode)startGame();else display()}else{Z.lesson='';Z.mode='';display()}}
window.addEventListener('hashchange',()=>parseHash());parseHash();
</script></body></html>

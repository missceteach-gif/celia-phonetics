<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#243d50">
  <title>A1 | Messages, notes & notices</title>
  <style>
    :root{--ink:#243d50;--muted:#60737e;--paper:#f6f8f7;--line:#dae4e3;--teal:#137d7a;--mint:#e3f3ed;--coral:#d56153;--amber:#fff0c7;--white:#fff;--shadow:0 10px 30px rgba(18,50,62,.09)}
    *{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font-family:system-ui,-apple-system,'Segoe UI',Arial,sans-serif;font-size:17px;line-height:1.48}
    button,input,select,textarea{font:inherit}button{cursor:pointer}button:disabled{opacity:.52;cursor:not-allowed}button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:3px solid #7dd3c1;outline-offset:2px}
    .page{max-width:1100px;margin:0 auto;padding:22px 18px 80px}.topbar{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:18px}.brand{font-size:15px;letter-spacing:.035em;font-weight:800;color:var(--teal)}.teacher-entry{border:1px solid var(--line);background:#fff;border-radius:999px;color:var(--ink);font-size:14px;font-weight:750;padding:9px 14px}.hero{border-radius:23px;background:linear-gradient(110deg,#243d50,#316268);padding:28px 30px;color:white;box-shadow:var(--shadow);margin-bottom:23px}.eyebrow{font-size:13px;font-weight:800;letter-spacing:.12em;text-transform:uppercase;color:#b8eee0}.hero h1{font-family:Georgia,'Times New Roman',serif;font-size:clamp(31px,5vw,47px);line-height:1.12;margin:8px 0 10px}.hero p{margin:0;color:#dbe7e5;font-size:16px}.chip{display:inline-block;background:#ffffff28;border:1px solid #ffffff40;border-radius:999px;font-size:13px;padding:4px 10px;margin-top:15px}
    .steps{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:22px}.step{border:1px solid var(--line);background:white;border-radius:13px;padding:10px 11px;text-align:left;font-size:13px;font-weight:750;color:var(--muted);min-height:58px}.step.active{border-color:var(--teal);color:var(--teal);background:#e7f5f0}.step.done:before{content:'✓ ';color:var(--teal)}
    .panel,.lesson-card{background:var(--white);border:1px solid var(--line);box-shadow:var(--shadow);border-radius:20px;padding:25px;margin:0 0 18px}.lesson-card{box-shadow:none;background:#fff;padding:20px}.section-title{font-family:Georgia,'Times New Roman',serif;font-size:28px;line-height:1.2;margin:0 0 6px}.sub{font-size:15px;color:var(--muted);margin:0 0 18px}.section-kicker{font-size:12px;font-weight:900;color:var(--teal);letter-spacing:.12em;text-transform:uppercase;margin-bottom:6px}.question-title{font-size:20px;margin:0 0 4px}.translation{font-size:14px;color:var(--muted);margin:0 0 18px}.minihead{font-weight:800;margin:0 0 9px}.divider{border:0;height:1px;background:var(--line);margin:25px 0}.text-cards{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:13px}.sample{border-radius:16px;min-height:220px;padding:19px 15px;position:relative;font-size:16px}.sample .letter{display:inline-grid;place-items:center;border-radius:50%;background:var(--ink);color:white;font-size:15px;font-weight:900;width:32px;height:32px;margin-bottom:10px}.poster{background:#f3f0e7;text-align:center;border:1px solid #dfd9cb}.poster .letter{position:absolute;left:12px;top:12px}.poster .bookicon{font-size:38px;margin:14px 0 6px}.poster .headline{color:#ba2b2a;font-size:30px;font-weight:900;line-height:1.05}.poster .details{font-size:14px;line-height:1.6;margin-top:12px}.note{background:#ffec99;transform:rotate(1deg);border:1px solid #f4d766;box-shadow:0 8px 13px #6b591c16}.note p{font-family:'Comic Sans MS','Segoe Print',cursive;font-size:20px;line-height:1.45;margin:5px}.note .sign{text-align:right}.chat{background:#e9f0eb;border:1px solid #cee0d4}.bubble{border-radius:16px 16px 4px 16px;background:#fff;padding:13px;margin:8px 0 0;font-size:16px;line-height:1.5}
    .place-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}.place{border-radius:16px;overflow:hidden;border:1px solid var(--line);background:#f6f6f4}.place .visual{height:166px;display:flex;justify-content:center;align-items:center;background:#efefec;overflow:hidden}.place .visual img{width:100%;height:100%;object-fit:contain}.place:nth-child(2) .visual img{object-fit:cover}.place:nth-child(3) .visual img{object-fit:cover}.place .place-bottom{padding:10px 12px 13px;display:flex;flex-wrap:wrap;justify-content:space-between;align-items:center;gap:9px;font-size:16px;font-weight:800}
    label{display:block;font-size:15px;font-weight:700;color:var(--ink)}input[type=text],input[type=password],select,textarea{width:100%;background:white;border:1px solid #bdcfcd;border-radius:11px;padding:11px 12px;min-height:44px;color:var(--ink)}select{width:auto;min-width:115px;padding-right:30px}textarea{min-height:95px;resize:vertical}.large-area{min-height:150px}.answers{display:grid;gap:10px}.answer-row{display:flex;gap:15px;align-items:center;justify-content:space-between;border:1px solid var(--line);border-radius:12px;padding:12px 14px;background:#fff}.answer-row .prompt{flex:1}.answer-row select{flex:0 0 auto}.grid-2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.form-field{display:grid;gap:7px}.field-tip{font-size:13px;color:var(--muted)}.code-word{font-style:italic;background:#f2f6f5;padding:2px 6px;border-radius:5px}.rule{background:var(--mint);border-radius:14px;padding:18px;margin:14px 0}.rule p{margin:7px 0}.rule strong{color:#125f5a}.mark{color:var(--coral);font-weight:800}.choices{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}.word-choice{border:1px solid #bdcfcd;border-radius:9px;background:#fff;padding:7px 10px;font-weight:650}.word-choice.selected{background:var(--teal);border-color:var(--teal);color:white}.example{background:#f6f8f7;border-radius:11px;padding:12px;margin-bottom:14px;color:#46535d}.task-card{border:1px solid var(--line);border-radius:15px;padding:18px;margin:0 0 17px;background:#fff}.task-card h3{margin:0 0 9px;font-size:19px}.prompt-list{margin:5px 0 12px;padding-left:19px;font-size:15px;color:var(--muted)}.prompt-list li{margin:3px 0}.nav{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;margin-top:20px}.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;border:0;border-radius:11px;padding:13px 20px;font-weight:800;background:var(--teal);color:white;min-height:45px}.btn.secondary{background:#e9eeec;color:var(--ink)}.btn.soft{background:var(--mint);color:var(--teal)}.btn.danger{background:#ffe9e4;color:#9f342e}.hint{font-size:14px;color:var(--muted)}.status{border-radius:12px;padding:12px 14px;margin:13px 0;font-size:15px}.status.info{background:#e8f3f8;color:#24576d}.status.good{background:#e4f5ec;color:#175e47}.status.bad{background:#ffede8;color:#9b3d2b}.hidden{display:none!important}.result-score{font-size:48px;font-weight:900;color:var(--teal);line-height:1}.result-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin:16px 0}.result-cell{border:1px solid var(--line);border-radius:12px;padding:13px;background:#f9fbfa}.result-cell strong{display:block}.review-list{padding-left:20px;margin-bottom:10px}.review-list li{margin-bottom:7px}.receipt{padding:13px;background:#edf7f1;border:1px dashed var(--teal);border-radius:12px;font-family:monospace;font-size:16px;overflow-wrap:anywhere}.spinner{display:inline-block;border:3px solid #c6e2db;border-top-color:var(--teal);width:22px;height:22px;border-radius:50%;animation:spin 1s linear infinite}@keyframes spin{to{transform:rotate(360deg)}}.feedback-item{padding:14px 0;border-top:1px solid var(--line)}.feedback-item p{white-space:pre-wrap}.teacher-table-wrap{overflow-x:auto}.teacher-table{width:100%;border-collapse:collapse;font-size:14px;white-space:nowrap}.teacher-table th,.teacher-table td{padding:11px;border-bottom:1px solid var(--line);text-align:left}.teacher-table th{background:#f0f6f4}.teacher-table button{border:1px solid var(--line);border-radius:9px;background:white;padding:7px 11px}.teacher-detail{margin-top:18px}.student-work{background:#f6f8f7;border:1px solid var(--line);border-radius:12px;padding:12px;white-space:pre-wrap;overflow-wrap:anywhere;margin-bottom:12px}.admin-banner{background:#e5f3f1;border-radius:11px;padding:12px;margin-bottom:17px;color:#195953;font-size:14px}.footer{color:var(--muted);font-size:13px;text-align:center;margin-top:30px}

  const defaultAnswers=()=>({a:['','',''],b:['','',''],c:['','',''],d:['','','','']});
  const safeParse=(key,fallback)=>{try{return JSON.parse(localStorage.getItem(key))||fallback}catch(_){return fallback}};
  let saved=safeParse(DRAFT_KEY,{});
  let state={step:0,name:saved.name||'',group:saved.group||'',answers:saved.answers||defaultAnswers(),notes:saved.notes||['','',''],writing:saved.writing||['','',''],submitted:false,receipt:(()=>{try{return localStorage.getItem(RECEIPT_KEY)||''}catch(_){return ''}})(),lastResult:null};
  let teacherState={loggedIn:false,pin:'',items:[],selected:null};
  const $=s=>document.querySelector(s), esc=x=>String(x??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
  const clean=x=>String(x??'').trim();
  function saveDraft(){try{localStorage.setItem(DRAFT_KEY,JSON.stringify({name:state.name,group:state.group,answers:state.answers,notes:state.notes,writing:state.writing}))}catch(_){}}
  function callServer(method,...args){return new Promise((resolve,reject)=>{if(!SERVER){reject(new Error('Server not connected'));return}const r=google.script.run.withSuccessHandler(resolve).withFailureHandler(err=>reject(new Error(err?.message||String(err))));r[method](...args)})}
  function stepUi(){ $('#steps').innerHTML=stepLabels.map((l,i)=>`<button class="step ${i===state.step?'active':''} ${i<state.step?'done':''}" data-jump="${i}" type="button">${l}</button>`).join(''); }
  function wrap(kicker,title,subtitle,body){return `<section class="panel"><div class="section-kicker">${kicker}</div><h2 class="section-title">${title}</h2><p class="sub">${subtitle}</p>${body}</section>`}
  function dropdown(name,idx,values,selected,placeholder='Choose / Elige'){return `<select aria-label="${esc(name)}" data-kind="${name}" data-idx="${idx}"><option value="">${placeholder}</option>${values.map(v=>`<option value="${esc(v[0])}" ${selected===v[0]?'selected':''}>${esc(v[1])}</option>`).join('')}</select>`}
  function row(label,control){return `<div class="answer-row"><div class="prompt">${label}</div>${control}</div>`}
  function navButtons(){return `<div class="nav"><button type="button" class="btn secondary" id="backBtn" ${state.step===0?'disabled':''}>← Back / Atrás</button><span class="hint">Your answers are saved on this device while you work.</span><button type="button" class="btn" id="nextBtn">${state.step===3?'Submit / Enviar ✓':'Next / Siguiente →'}</button></div>`}
  function readSection(){
    const samples=`<h3 class="question-title">Read texts A–C</h3><p class="translation">Lee los tres textos. Puedes volver a mirarlos mientras respondes.</p><div class="text-cards"><article class="sample poster"><div class="letter">A</div><div class="bookicon">📚</div><div class="headline">CHEAP<br>BOOKS!</div><div class="details">Come to our book sale!<br><b>Friday October 15 at 10.30</b><br>Bilbury Village Hall</div></article><article class="sample note"><div class="letter">B</div><p>Alex,<br>I'm at the gym.<br>Please make salad for lunch.<br><span class="sign">Love Mum</span></p></article><article class="sample chat"><div class="letter">C</div><div class="bubble">Hi Chris! It’s Sam’s birthday on Friday 🥳 Surprise party at Acropolis restaurant 7.30. <b>Don’t tell Sam!</b> 🤐</div></article></div>`;
    const aRows=places.map((p,i)=>`<article class="place"><div class="visual"><img src="${p.img}" alt="${esc(p.label)}" loading="lazy"></div><div class="place-bottom"><span>${p.label}</span>${dropdown('a',i,[['A','Text A'],['B','Text B'],['C','Text C']],state.answers.a[i])}</div></article>`).join('');
    const bPrompts=['1 · a friend / un amigo','2 · a family member / un familiar','3 · a lot of people / mucha gente'];
    const bRows=bPrompts.map((p,i)=>row(p,dropdown('b',i,[['A','Text A'],['B','Text B'],['C','Text C']],state.answers.b[i]))).join('');
    return wrap('Part A · Reading','Where does each text belong?','¿Dónde va cada texto? Lee los textos y completa los dos ejercicios.',`${samples}<hr class="divider"><h3 class="question-title">a · Match A–C to places 1–3</h3><p class="translation">Relaciona cada texto con el lugar correcto.</p><div class="place-grid">${aRows}</div><hr class="divider"><h3 class="question-title">b · Who is each text for?</h3><p class="translation">¿A quién va dirigido cada texto?</p><div class="answers">${bRows}</div>`);
  }
  function grammarSection(){
    const cPrompts=['Come to our book sale!','Please make salad for lunch.','Don’t tell Sam!'];
    const cRows=cPrompts.map((p,i)=>row(`<b>${i+1}.</b> “${p}”`,dropdown('c',i,[['1','1 · Tell someone what (not) to do'],['2','2 · Public notice / advert']],state.answers.c[i]))).join('');
    const sentences=[['To','visit','my','website.'],['You','don’t','use','my','computer.'],['Please','to','make','fajitas.'],['Please','don’t','to','worry.']];
    const dRows=sentences.map((words,i)=>`<div class="task-card"><div style="font-weight:800">${i+1}. ${words.map(esc).join(' ')}</div><div class="field-tip">Tap the extra word / Pulsa la palabra que sobra.</div><div class="choices">${words.map((word,j)=>`<button type="button" class="word-choice ${state.answers.d[i]===String(j)?'selected':''}" data-word-row="${i}" data-word-idx="${j}" aria-pressed="${state.answers.d[i]===String(j)}">${esc(word)}</button>`).join('')}</div></div>`).join('');
    return wrap('Parts C–D · Grammar','Use imperatives','Usa el imperativo para dar instrucciones, pedir cosas y escribir avisos.',`<div class="rule"><strong>Imperatives in short texts / El imperativo en textos breves</strong><p><b>1.</b> Tell someone what (not) to do: <i>Go home. Don’t be late.</i></p><p><b>2.</b> Public notices and adverts: <i>Come to New York!</i></p><p>Add <b>please</b> to be polite: <i>Please be quiet.</i></p></div><h3 class="question-title">c · Match each example to use 1 or 2</h3><p class="translation">¿Qué función tiene cada imperativo?</p><div class="answers">${cRows}</div><hr class="divider"><h3 class="question-title">d · Cross out the extra word</h3><p class="translation">Tacha la palabra que sobra para formar un imperativo correcto.</p><div class="example">Example: Please take <s>you</s> a cake.</div>${dRows}`);
  }
  function noteField(i,q,placeholder){return `<div class="form-field"><label for="note-${i}">${q}</label><input type="text" id="note-${i}" data-note="${i}" placeholder="${placeholder}" value="${esc(state.notes[i])}" maxlength="600"></div>`}
  function writingSection(){return wrap('Parts E–G · Writing','Plan, then write three short texts','Planifica y escribe. Tu profesora leerá los textos y podrá darte comentarios personalizados.',`
    <div class="task-card"><h3>1 · A note for a family member</h3><p class="translation">No estás en casa. Es la hora de cenar. Deja una nota a un familiar.</p><ul class="prompt-list"><li>Who is the note for?</li><li>Where are you?</li><li>What do you want the family member to do?</li></ul>${noteField(0,'Plan / Ideas','e.g. Dad · supermarket · make dinner')}<div class="form-field" style="margin-top:12px"><label for="writing-0">Your note / Tu nota</label><textarea class="large-area" id="writing-0" data-writing="0" maxlength="4000" placeholder="Hi ...,&#10;I’m at ... . Please ... .&#10;Love, ...">${esc(state.writing[0])}</textarea></div></div>
    <div class="task-card"><h3>2 · A public notice: free concert</h3><p class="translation">Tu grupo de música ofrece un concierto gratis. Escribe un aviso público.</p><ul class="prompt-list"><li>When is the concert? What time?</li><li>Where is the concert?</li><li>Invite people to come!</li></ul>${noteField(1,'Plan / Ideas','e.g. Saturday · 8 pm · City Hall')}<div class="form-field" style="margin-top:12px"><label for="writing-1">Your notice / Tu aviso</label><textarea class="large-area" id="writing-1" data-writing="1" maxlength="4000" placeholder="FREE CONCERT!&#10;Come to ... !&#10;Saturday at ...">${esc(state.writing[1])}</textarea></div></div>
    <div class="task-card"><h3>3 · A message: Lin’s birthday party</h3><p class="translation">Es el cumpleaños de Lin. Escribe un mensaje a un amigo sobre la fiesta.</p><ul class="prompt-list"><li>Who is the message for?</li><li>What day is Lin’s birthday?</li><li>Where and when is the party?</li><li>Keep the party a surprise!</li></ul>${noteField(2,'Plan / Ideas','e.g. Chris · Friday · café · 7.30')}<div class="form-field" style="margin-top:12px"><label for="writing-2">Your message / Tu mensaje</label><textarea class="large-area" id="writing-2" data-writing="2" maxlength="4000" placeholder="Hi ...,&#10;It’s Lin’s birthday on ... .&#10;The party is at ... . Don’t tell Lin!">${esc(state.writing[2])}</textarea></div></div>
    <div class="rule"><b>Before you submit / Antes de enviar</b><p>✓ Check names, days and times.<br>✓ Use capital letters and punctuation.<br>✓ Use <b>Please + verb</b> and <b>Don’t + verb</b> correctly.</p></div>`)}
  function finalSection(){return wrap('Part G · Submit','Ready for teacher feedback?','Escribe tu nombre para que la profesora pueda identificar tu entrega.',`
    <div class="grid-2"><div class="form-field"><label for="studentName">Full name / Nombre y apellido *</label><input type="text" id="studentName" autocomplete="name" maxlength="80" placeholder="Your name" value="${esc(state.name)}"></div><div class="form-field"><label for="studentGroup">Class / Grupo *</label><input type="text" id="studentGroup" maxlength="40" placeholder="e.g. A1 Monday / A1 Grupo 1" value="${esc(state.group)}"></div></div>
    <p class="hint" style="margin-top:12px">When submissions are activated, your teacher will receive your answers and texts. For now, this page is for practice only. / Por ahora no se envía ninguna tarea.</p><div id="preSubmitStatus"></div><div class="rule"><b>What happens next?</b><p><b>1.</b> Your matching and grammar answers are checked automatically.<br><b>2.</b> Your three written texts go to your teacher.<br><b>3.</b> You receive a private submission code to check the teacher's feedback later.</p></div>${!SERVER?'<div class="status info"><b>Preview mode:</b> This downloaded file stores submissions <b>only in this browser</b>. To receive real submissions from students, your teacher must first publish the included Google Apps Script project.</div>':''}`)}
  function render(){ $('#studentApp').classList.remove('hidden');$('#teacherApp').classList.add('hidden');stepUi();$('#content').innerHTML=[readSection,grammarSection,writingSection,finalSection][state.step]()+navButtons(); if(state.step===3)$('#nextBtn').textContent='Submit homework / Enviar tarea ✓'; document.querySelectorAll('[data-jump]').forEach(b=>b.addEventListener('click',()=>goto(Number(b.dataset.jump)))); $('#backBtn').addEventListener('click',()=>goto(state.step-1)); $('#nextBtn').addEventListener('click',()=>state.step===3?submit():goto(state.step+1)); bindFields(); }
  function goto(i){ if(i<0||i>3)return;saveDraft();state.step=i;render();window.scrollTo({top:0,behavior:'smooth'})}
  function bindFields(){document.querySelectorAll('select[data-kind]').forEach(el=>el.addEventListener('change',()=>{state.answers[el.dataset.kind][Number(el.dataset.idx)]=el.value;saveDraft()}));document.querySelectorAll('[data-word-row]').forEach(el=>el.addEventListener('click',()=>{const row=Number(el.dataset.wordRow),idx=el.dataset.wordIdx;state.answers.d[row]=idx;document.querySelectorAll(`[data-word-row="${row}"]`).forEach(b=>{b.classList.toggle('selected',b.dataset.wordIdx===idx);b.setAttribute('aria-pressed',String(b.dataset.wordIdx===idx))});saveDraft()}));document.querySelectorAll('[data-note]').forEach(el=>el.addEventListener('input',()=>{state.notes[Number(el.dataset.note)]=el.value;saveDraft()}));document.querySelectorAll('[data-writing]').forEach(el=>el.addEventListener('input',()=>{state.writing[Number(el.dataset.writing)]=el.value;saveDraft()}));$('#studentName')?.addEventListener('input',e=>{state.name=e.target.value;saveDraft()});$('#studentGroup')?.addEventListener('input',e=>{state.group=e.target.value;saveDraft()})}
  function localGrade(answers){const correct={a:['C','A','B'],b:['C','B','A'],c:['2','1','1'],d:['0','0','1','2']};let total=0;let mistakes=[];for(const key of Object.keys(correct)){correct[key].forEach((v,i)=>{if(String(answers?.[key]?.[i]??'')===v)total++;else mistakes.push({part:key.toUpperCase(),number:i+1,expected:key==='d'?['To','You','to','to'][i]:v})})}return {score:total,total:13,mistakes}}
  function getDemoRows(){return safeParse(DEMO_ROWS,[])}
  function updateDemoRows(rows){try{localStorage.setItem(DEMO_ROWS,JSON.stringify(rows))}catch(_){}}
  function demoSubmit(payload){const id='DEMO-'+Math.random().toString(36).slice(2,10).toUpperCase();const grade=localGrade(payload.answers);const row={id,time:new Date().toISOString(),name:payload.name,group:payload.group,answers:payload.answers,notes:payload.notes,writing:payload.writing,score:grade.score,total:13,feedback:['','','',''],reviewed:false};const rows=getDemoRows();rows.unshift(row);updateDemoRows(rows);return {id,...grade,mode:'demo'}}
  async function submit(){const status=$('#preSubmitStatus');if(!clean(state.name)||!clean(state.group)){status.innerHTML='<div class="status bad">Please enter your name and class. / Escribe tu nombre y tu grupo.</div>';return}if(state.writing.some(w=>clean(w).length<10)){status.innerHTML='<div class="status bad">Please complete all three writing tasks (at least 10 characters each). / Completa los tres textos.</div>';return}const incomplete=['a','b','c','d'].some(k=>state.answers[k].some(x=>x===''));if(incomplete){status.innerHTML='<div class="status bad">Please complete the matching and grammar exercises too. / Completa también los ejercicios de comprensión y gramática.</div>';return}const payload={name:clean(state.name),group:clean(state.group),answers:state.answers,notes:state.notes,writing:state.writing};const btn=$('#nextBtn');btn.disabled=true;btn.innerHTML='<span class="spinner" aria-hidden="true"></span> Submitting…';try{const result=SERVER?await callServer('submitWork',payload):demoSubmit(payload);state.submitted=true;state.receipt=result.id;state.lastResult=result;try{localStorage.setItem(RECEIPT_KEY,result.id)}catch(_){}showSubmitted(result)}catch(e){btn.disabled=false;btn.textContent='Submit homework / Enviar tarea ✓';status.innerHTML=`<div class="status bad">Submission failed: ${esc(e.message)}. Your work is still saved here. Please try again.</div>`}}
  function showSubmitted(result){$('#steps').innerHTML='';$('#content').innerHTML=wrap('Submitted · Entregado',SERVER?'Homework received!':'Preview completed!',SERVER?'Your work has been saved for your teacher. / Tu profesora ha recibido la tarea.':'In this preview, nothing has been sent to your teacher.',`<div class="result-score">${result.score} / ${result.total}</div><p class="hint">Automatic score: reading + grammar. Your writing will be reviewed separately.</p><h3 class="question-title">Answer key / Soluciones</h3><div class="result-grid"><div class="result-cell"><strong>a · Places</strong>1 = C · 2 = A · 3 = B</div><div class="result-cell"><strong>b · Audience</strong>1 = C · 2 = B · 3 = A</div><div class="result-cell"><strong>c · Uses</strong>1 = 2 · 2 = 1 · 3 = 1</div><div class="result-cell"><strong>d · Extra words</strong>1 To · 2 You · 3 to · 4 to</div></div><p class="minihead">Your private submission code / Código de entrega</p><div class="receipt">${esc(result.id)}</div><p class="hint">Keep this code so you can check your teacher's comments later. / Guarda este código.</p><div class="nav">${!SERVER?'<button class="btn" id="downloadHomework">Download answers / Descargar tarea ↓</button>':''}<button class="btn soft" id="copyCode">Copy code</button><button class="btn secondary" id="feedbackCheck">Check feedback</button><button class="btn" id="newAttempt">New attempt</button></div><div id="feedbackDisplay"></div>`);if(!SERVER){$('#downloadHomework').addEventListener('click',()=>{const lines=['A1 · Messages, notes & notices','Name / Nombre: '+state.name,'Class / Grupo: '+state.group,'Reading and grammar: '+result.score+'/'+result.total,'','1 · Note / Nota',state.writing[0],'','2 · Notice / Aviso',state.writing[1],'','3 · Message / Mensaje',state.writing[2]];const blob=new Blob([lines.join('\n')],{type:'text/plain;charset=utf-8'});const url=URL.createObjectURL(blob);const a=document.createElement('a');a.href=url;a.download='A1-messages-homework.txt';document.body.appendChild(a);a.click();a.remove();URL.revokeObjectURL(url)})};$('#copyCode').addEventListener('click',()=>{navigator.clipboard?.writeText(result.id).then(()=>{$('#copyCode').textContent='Copied ✓'}).catch(()=>window.prompt('Copy your code:',result.id))});$('#feedbackCheck').addEventListener('click',()=>showFeedbackCheck(result.id));$('#newAttempt').addEventListener('click',()=>{if(!confirm('Start a new attempt? Your submitted work stays saved, but this draft will be cleared.'))return;state={...state,step:0,answers:defaultAnswers(),notes:['','',''],writing:['','',''],submitted:false,lastResult:null};saveDraft();render()})}
  async function showFeedbackCheck(id){const box=$('#feedbackDisplay')||$('#content');box.innerHTML=`<div class="status info">Checking feedback…</div>`;try{const row=SERVER?await callServer('getStudentFeedback',id):getDemoRows().find(r=>r.id===id);if(!row){box.innerHTML='<div class="status bad">Code not found / No encontramos ese código.</div>';return}let fb=row.feedback||['','','',''];if(!row.reviewed){box.innerHTML='<div class="status info">Your teacher has not reviewed your writing yet. / Tu profesora aún no ha revisado tus textos.</div>';return}box.innerHTML=`<div class="status good">Feedback is ready! / ¡Ya tienes comentarios!</div>${['Note / Nota','Notice / Aviso','Message / Mensaje','General comments / Comentario general'].map((label,i)=>`<div class="feedback-item"><b>${label}</b><p>${esc(fb[i]||'No additional comments.')}</p></div>`).join('')}`;}catch(e){box.innerHTML=`<div class="status bad">${esc(e.message)}</div>`}}
  function feedbackLookupView(){ $('#steps').innerHTML='';$('#content').innerHTML=wrap('Feedback · Comentarios','Check your teacher’s feedback','Introduce el código de entrega que recibiste al enviar la tarea.',`<div class="form-field"><label for="lookupCode">Submission code / Código de entrega</label><input id="lookupCode" type="text" placeholder="Paste your code" value="${esc(state.receipt)}"></div><div class="nav"><button class="btn secondary" id="lookupBack">← Back</button><button class="btn" id="lookupBtn">Check feedback</button></div><div id="feedbackDisplay"></div>`);$('#lookupBack').addEventListener('click',()=>render());$('#lookupBtn').addEventListener('click',()=>showFeedbackCheck(clean($('#lookupCode').value)))}
  function teacherLogin(){teacherState.loggedIn=false;$('#studentApp').classList.add('hidden');$('#teacherApp').classList.remove('hidden');$('#teacherApp').innerHTML=wrap('Teacher dashboard','Review student homework','Login to view submissions and write individual feedback. / Acceso para la profesora.',`<div class="form-field"><label for="pin">Teacher PIN / Contraseña docente</label><input id="pin" type="password" autocomplete="off" placeholder="Teacher PIN" /></div><div class="nav"><button id="exitTeacher" class="btn secondary">← Back to lesson</button><button id="loginTeacher" class="btn">Open dashboard</button></div>${!SERVER?'<div class="status info">Preview mode: use <b>DEMO</b> as your PIN. Only submissions from this browser are visible.</div>':''}<div id="loginError"></div>`);$('#exitTeacher').addEventListener('click',()=>render());$('#loginTeacher').addEventListener('click',async()=>{const pin=clean($('#pin').value);$('#loginTeacher').disabled=true;try{if(!SERVER&&pin!=='DEMO')throw new Error('Invalid demo PIN');const items=SERVER?await callServer('getTeacherSubmissions',pin):getDemoRows();teacherState={loggedIn:true,pin,items,selected:null};teacherDashboard()}catch(e){$('#loginError').innerHTML=`<div class="status bad">${esc(e.message)}</div>`;$('#loginTeacher').disabled=false}})}
  function teacherDashboard(){if(!teacherState.loggedIn)return teacherLogin();const items=teacherState.items;const count=items.length,reviewed=items.filter(x=>x.reviewed).length;$('#teacherApp').innerHTML=wrap('Teacher dashboard','Student submissions',`Entregas: ${count} · Reviewed / Corregidas: ${reviewed} · Pending / Pendientes: ${count-reviewed}`,`<div class="admin-banner">Only the teacher can open and update this dashboard. Students see their own feedback using their submission code.</div><div class="nav" style="margin:0 0 16px"><button class="btn secondary" id="goLesson">← Student view</button><button class="btn soft" id="refreshList">Refresh / Actualizar</button></div><div class="grid-2"><div class="form-field"><label>Find student / Buscar alumno</label><input id="filterName" type="text" placeholder="Name or group"></div><div class="form-field"><label>Status / Estado</label><select id="filterStatus"><option value="all">All / Todos</option><option value="pending">Pending</option><option value="reviewed">Reviewed</option></select></div></div><div id="teacherRows" class="teacher-table-wrap" style="margin-top:18px"></div><div id="teacherDetail" class="teacher-detail"></div>`);$('#goLesson').addEventListener('click',()=>render());$('#refreshList').addEventListener('click',async()=>{try{teacherState.items=SERVER?await callServer('getTeacherSubmissions',teacherState.pin):getDemoRows();teacherDashboard()}catch(e){alert(e.message)}});$('#filterName').addEventListener('input',drawRows);$('#filterStatus').addEventListener('change',drawRows);drawRows()}
  function drawRows(){const q=clean($('#filterName').value).toLowerCase(),s=$('#filterStatus').value;const items=teacherState.items.filter(x=>(!q||(x.name+' '+x.group).toLowerCase().includes(q))&&(s==='all'||(s==='reviewed'&&x.reviewed)||(s==='pending'&&!x.reviewed)));$('#teacherRows').innerHTML=items.length?`<table class="teacher-table"><thead><tr><th>Student</th><th>Class</th><th>Automatic</th><th>Date</th><th>Status</th><th>Action</th></tr></thead><tbody>${items.map((r,i)=>`<tr><td>${esc(r.name)}</td><td>${esc(r.group)}</td><td>${r.score}/13</td><td>${esc(new Date(r.time).toLocaleString())}</td><td>${r.reviewed?'✓ Reviewed':'Pending'}</td><td><button type="button" data-open="${esc(r.id)}">Review</button></td></tr>`).join('')}</tbody></table>`:'<div class="status info">No submissions match this filter.</div>';document.querySelectorAll('[data-open]').forEach(b=>b.addEventListener('click',()=>teacherReview(b.dataset.open)))}
  function teacherReview(id){const r=teacherState.items.find(x=>x.id===id);if(!r)return;teacherState.selected=id;$('#teacherDetail').innerHTML=`<div class="lesson-card"><h3 class="question-title">${esc(r.name)} · ${esc(r.group)}</h3><div class="hint">${esc(r.id)} · Auto-graded: ${r.score}/13</div><div class="result-grid"><div class="result-cell"><b>a · Places</b><p>${esc(r.answers?.a?.join(', '))}</p></div><div class="result-cell"><b>b · Audience</b><p>${esc(r.answers?.b?.join(', '))}</p></div><div class="result-cell"><b>c · Imperatives</b><p>${esc(r.answers?.c?.join(', '))}</p></div><div class="result-cell"><b>d · Extra words</b><p>${(r.answers?.d||[]).map((v,i)=>esc(([['To','visit','my','website.'],['You','don’t','use','my','computer.'],['Please','to','make','fajitas.'],['Please','don’t','to','worry.']][i]||[])[Number(v)]||'–')).join(', ')}</p></div></div>${['A note for a family member','A public notice','A birthday message'].map((label,i)=>`<h4 style="margin-bottom:7px">${i+1} · ${label}</h4><div class="hint">Plan: ${esc(r.notes?.[i]||'–')}</div><div class="student-work">${esc(r.writing?.[i]||'–')}</div><div class="form-field"><label for="fb-${i}">Your feedback / Tu corrección</label><textarea id="fb-${i}" placeholder="What was good? What should they change?">${esc(r.feedback?.[i]||'')}</textarea></div>`).join('')}<div class="form-field" style="margin-top:15px"><label for="fb-3">General feedback / Comentario general</label><textarea id="fb-3" placeholder="Well done! Remember to...">${esc(r.feedback?.[3]||'')}</textarea></div><div id="saveFeedbackStatus"></div><div class="nav"><button id="closeReview" class="btn secondary">Close</button><button id="saveReview" class="btn">Save & publish feedback ✓</button></div></div>`;$('#closeReview').addEventListener('click',()=>$('#teacherDetail').innerHTML='');$('#saveReview').addEventListener('click',async()=>{const feedback=[0,1,2,3].map(i=>$('#fb-'+i).value);$('#saveReview').disabled=true;try{if(SERVER)await callServer('saveTeacherFeedback',teacherState.pin,id,feedback);else{const rows=getDemoRows();const target=rows.find(x=>x.id===id);if(target){target.feedback=feedback;target.reviewed=true;updateDemoRows(rows)}}r.feedback=feedback;r.reviewed=true;$('#saveFeedbackStatus').innerHTML='<div class="status good">Feedback saved! The student can now see it using the submission code.</div>';$('#saveReview').disabled=false;drawRows()}catch(e){$('#saveFeedbackStatus').innerHTML=`<div class="status bad">${esc(e.message)}</div>`;$('#saveReview').disabled=false}});$('#teacherDetail').scrollIntoView({behavior:'smooth',block:'start'})}
  $('#teacherAccess').addEventListener('click',()=>{if($('#teacherApp').classList.contains('hidden'))teacherLogin();else render()});
  render();
  // Feedback can be retrieved without creating a new attempt.
  const feedbackLink=document.createElement('button');feedbackLink.className='teacher-entry';feedbackLink.style.marginRight='8px';feedbackLink.textContent='My feedback';feedbackLink.addEventListener('click',()=>{if(!$('#teacherApp').classList.contains('hidden'))render();feedbackLookupView()});$('#teacherAccess').before(feedbackLink);
})();
</script>
